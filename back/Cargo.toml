[package]
name = "policy-lab-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.1"
tokio = { version = "1.43.0", features = ["full"] }
tower-http = { version = "0.6.2", features = ["cors"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rand = "0.8.5"
rand_chacha = "0.3.1"
chrono = "0.4.39"
uuid = { version = "1.12.1", features = ["v4"] }
