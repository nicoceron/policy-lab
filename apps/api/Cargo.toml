[package]
name = "polizas-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
rand_chacha = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
chrono = "0.4"
